<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP Order Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--card:#fff;--accent:#1a365d;--accent2:#2b6cb0;--text:#1a202c;--muted:#718096;--border:#e2e8f0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--accent);color:#fff;padding:12px 20px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.hdr small{font-weight:400;opacity:.7;font-size:12px}
.chat{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;animation:fadeIn .2s}
.msg.user{align-self:flex-end}
.msg.bot{align-self:flex-start}
.msg-body{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6}
.msg.user .msg-body{background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.msg.bot .msg-body{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg-body table{border-collapse:collapse;width:100%;margin:6px 0;font-size:11px}
.msg-body th,.msg-body td{padding:4px 8px;border:1px solid var(--border);text-align:left}
.msg-body th{background:var(--bg);font-weight:600}
.msg-body strong{font-weight:600}
.msg-body p{margin:0 0 6px}.msg-body p:last-child{margin:0}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--muted);display:inline-block;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
.bottom{padding:10px 20px 16px;background:var(--card);border-top:1px solid var(--border)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qb{padding:6px 12px;border-radius:16px;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s}
.qb:hover{border-color:var(--accent2);color:var(--accent2);background:#ebf8ff}
.ibox{display:flex;gap:8px}
.ibox input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.ibox input:focus{border-color:var(--accent2)}
.ibox button{padding:10px 20px;border:none;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600}
.ibox button:disabled{opacity:.4}
.ibox button:not(:disabled):hover{background:var(--accent2)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="hdr">SAP Order Bot <small>Pending / Dispatch / Invoices - Current FY</small></div>
<div class="chat" id="chat">
  <div class="msg bot"><div class="msg-body">
    Namaste! Main SAP orders aur invoices ka data bata sakta hu.<br>
    Aap aise pooch sakte ho:<br>
    - "current FY ke pending orders kitne hai?"<br>
    - "COFAT ke dispatched orders dikhao"<br>
    - "is saal ka total invoice value kitna hai?"
  </div></div>
</div>
<div class="bottom">
  <div class="quick">
    <button class="qb" onclick="send('Pending orders current FY')">Pending orders current FY</button>
    <button class="qb" onclick="send('Dispatched orders count')">Dispatched orders count</button>
    <button class="qb" onclick="send('Is saal ka total invoice value')">Is saal ka total invoice value</button>
  </div>
  <div class="ibox">
    <input id="inp" placeholder="Apna sawaal likho..." onkeydown="if(event.key==='Enter')send()">
    <button id="btn" onclick="send()">Send</button>
  </div>
</div>
<script>
const chat=document.getElementById('chat');
function addMsg(text,role){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML='<div class="msg-body">'+formatMd(text)+'</div>';
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}
function formatMd(t){
  let h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)*)/gm,(_,hdr,sep,body)=>{
    const ths=hdr.split('|').filter(Boolean).map(c=>'<th>'+c.trim()+'</th>').join('');
    const rows=body.trim().split('\n').map(r=>{
      const tds=r.split('|').filter(Boolean).map(c=>'<td>'+c.trim()+'</td>').join('');
      return '<tr>'+tds+'</tr>';
    }).join('');
    return '<table><thead><tr>'+ths+'</tr></thead><tbody>'+rows+'</tbody></table>';
  });
  h=h.replace(/\n/g,'<br>');
  return h;
}
async function send(t){
  const msg=t||document.getElementById('inp').value.trim();
  if(!msg)return;
  document.getElementById('inp').value='';
  addMsg(msg,'user');
  const typing=addMsg('<span class="typing"><span></span><span></span><span></span></span>','bot');
  document.getElementById('btn').disabled=true;
  try{
    const res=await fetch('/.netlify/functions/query',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:msg})
    });
    const data=await res.json();
    typing.remove();
    addMsg(data.answer||data.error||'Koi response nahi aaya','bot');
  }catch(e){
    typing.remove();
    addMsg('Error: '+e.message,'bot');
  }
  document.getElementById('btn').disabled=false;
}
</script>
</body>
</html>
